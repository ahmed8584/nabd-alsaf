<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#1e40af">
  <meta name="description" content="نبض الصف — منصة عربية متكاملة لإدارة القاعة الصفية وتعزيز الانضباط الإيجابي">
  
  <title>نبض الصف</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e40af'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white'>📈</text></svg>">
  <link rel="manifest" href="manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js" defer></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== View 1: Login ========== -->
<section id="view-login" class="view active">
  <div class="login-bg">
    <div class="login-decor decor-1"></div>
    <div class="login-decor decor-2"></div>
    <div class="login-decor decor-3"></div>
  </div>
  
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">
          <span class="logo-bar bar-1"></span>
          <span class="logo-bar bar-2"></span>
          <span class="logo-bar bar-3"></span>
          <span class="logo-arrow">↗</span>
        </div>
      </div>
      
      <h1 class="login-title">نبض الصف</h1>
      <p class="login-tagline">إدارة صفية ذكية وتفاعلية</p>
      
      <form id="login-form" class="login-form">
        <div class="input-group">
          <input 
            type="password" 
            id="login-password" 
            placeholder="كلمة المرور" 
            autocomplete="current-password"
            required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="login-submit">
          <span>دخول</span>
        </button>
      </form>
      
      <div id="login-error" class="login-error"></div>
      
      <div class="login-footer">
        <span>الإصدار 1.0.0</span>
        <span>•</span>
        <a href="#" id="login-demo-link">جرّب الوضع التجريبي</a>
      </div>
    </div>
  </div>
</section>

<!-- ========== View 2: Teacher App ========== -->
<div id="view-teacher" class="view hidden">
  
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">
        <span class="logo-bar bar-1"></span>
        <span class="logo-bar bar-2"></span>
        <span class="logo-bar bar-3"></span>
        <span class="logo-arrow">↗</span>
      </div>
      <div class="brand-text">
        <span class="brand-name">نبض الصف</span>
        <span class="brand-tagline">إدارة صفية ذكية</span>
      </div>
    </div>
    
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    
    <div class="sidebar-footer">
      <div class="user-chip" id="user-chip">
        <div class="user-avatar" id="user-avatar">؟</div>
        <div class="user-info">
          <div class="user-name" id="user-name">المعلم</div>
          <div class="user-role">معلم</div>
        </div>
        <!-- ✅ تم التعديل: ربط الزر بدالة handleLogout() -->
        <button class="btn-icon-sm" id="logout-btn" onclick="handleLogout()" title="خروج">🚪</button>
      </div>
    </div>
  </aside>
  
  <!-- Main area -->
  <div class="main-area">
    
    <header class="topbar">
      <button class="btn-icon menu-toggle" id="menu-toggle" aria-label="القائمة">☰</button>
      
      <div class="topbar-center">
        <h1 class="page-title" id="page-title">الرئيسية</h1>
        <div class="breadcrumb" id="breadcrumb"></div>
      </div>
      
      <div class="topbar-actions">
        <div class="class-selector-wrap" id="class-selector-wrap">
          <label class="class-selector-label">الفصل:</label>
          <select id="class-selector" class="class-selector">
            <option value="">— اختر فصلاً —</option>
          </select>
        </div>
        
        <button class="btn-icon" id="btn-class-switch" title="تبديل الفصل">
          📚
        </button>
        <button class="btn-icon" id="btn-theme" title="الوضع الليلي">🌙</button>
        <button class="btn-icon" id="btn-display-mode" title="وضع العرض">📺</button>
      </div>
    </header>
    
    <main class="content" id="content"></main>
  </div>
</div>

<!-- ========== View 3: Classroom Display ========== -->
<section id="view-classroom" class="view hidden">
  <div class="classroom-header">
    <div class="classroom-brand">
      <div class="brand-logo brand-logo-sm">
        <span class="logo-bar bar-1"></span>
        <span class="logo-bar bar-2"></span>
        <span class="logo-bar bar-3"></span>
        <span class="logo-arrow">↗</span>
      </div>
      <span>نبض الصف</span>
    </div>
    <div class="classroom-info">
      <span id="classroom-class-name">—</span>
      <span>•</span>
      <span id="classroom-subject">—</span>
    </div>
    <button class="btn-icon-sm" id="classroom-exit" title="خروج">✕</button>
  </div>
  
  <div class="classroom-content" id="classroom-content"></div>
  
  <div class="classroom-footer">
    <span id="classroom-clock" class="classroom-clock">--:--</span>
  </div>
</section>

<!-- ========== View 4: Student Mode ========== -->
<section id="view-student" class="view hidden">
  <div class="student-header">
    <div class="student-brand">نبض الصف</div>
    <button class="btn-icon-sm" id="student-exit" title="خروج">✕</button>
  </div>
  
  <div class="student-content" id="student-content"></div>
</section>

<!-- ========== Global Containers ========== -->
<div class="toast-container" id="toast-container"></div>
<div class="modal-container" id="modal-container"></div>
<div class="celebration-container" id="celebration-container"></div>

<!-- ========== Scripts ========== -->
<script src="config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/state.js"></script>
<script src="js/classes.js"></script>
<script src="js/students.js"></script>
<script src="js/points.js"></script>
<script src="js/tools.js"></script>
<script src="js/reports.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
